[project]
name = "cat-dog-nose"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=5.0.0.93",
    "tensorboard>=2.21.0",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true